[project]
name = "agno-example"
version = "0.1.0"
description = "An example agno agent: OpenRouter models, custom tools, SQLite history and an authenticated AgentOS API"
readme = "README.md"
authors = [
    { name = "Sergio Martin Rubio", email = "me@sergiomartinrubio.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agno>=3.1.12",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "greenlet>=3.5.6",
    "openai>=3.42.1",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
agno-example = "agno_example:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
